networks:
    trendsearth:

services:
    postgresdb:
        build:
            context: ./config/db
            dockerfile: Dockerfile
        deploy:
            resources:
                limits:
                    memory: 512M
        command: postgres -c max_connections=300 -c log_min_messages=LOG
        environment:
          - POSTGRES_DB=te_web
          - POSTGRES_USER=postgres
          - POSTGRES_PASSWORD=postgres
          - POSTGRES_PORT=5432
        networks:
            - trendsearth
        env_file:
            - ./.env

    app:
        build:
            context: ./app
        command: >
                sh -c "python manage.py migrate && gunicorn main.wsgi:application --bind 0.0.0.0:9000"
        ports:
          - target: 9000
            published: 9000
            protocol: tcp
            mode: ingress
        volumes:
            - ./app:/home/app
            - static_volume:/home/app/static
            - staticfiles_volume:/home/app/staticfiles
        env_file:
            - ./.env
        depends_on:
            - postgresdb
        networks:
            - trendsearth

    # Optional testing service - use: docker-compose run --rm test
    test:
        build:
            context: ./app
        command: python test_simple.py
        volumes:
            - ./app:/home/app
        env_file:
            - ./.env
        depends_on:
            - postgresdb
        networks:
            - trendsearth
        profiles:
            - testing
          
volumes:
    static_volume:
    staticfiles_volume:
