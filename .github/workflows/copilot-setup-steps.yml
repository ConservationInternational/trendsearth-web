name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            python3-dev \
            libsasl2-dev \
            libssl-dev \
            binutils \
            libproj-dev \
            gdal-bin \
            postgresql-client \
            libgdal-dev
          
          # Set GDAL environment variables
          export CPLUS_INCLUDE_PATH=/usr/include/gdal
          export C_INCLUDE_PATH=/usr/include/gdal

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Install GDAL Python bindings matching system GDAL version
          pip install GDAL==$(ogrinfo --version | cut -d' ' -f2 | cut -d',' -f1)
          
          # Install te_schemas from ConservationInternational GitHub
          pip install https://github.com/ConservationInternational/trends.earth-schemas/archive/refs/heads/master.zip
          
          # Install te_algorithms from ConservationInternational GitHub  
          pip install https://github.com/ConservationInternational/trends.earth-algorithms/archive/refs/heads/master.zip
          
          # Install main application dependencies
          cd app/
          pip install -r requirements.txt

      - name: Install testing and development dependencies
        run: |
          pip install ruff

      - name: Clone Trends.Earth ecosystem repositories
        run: |
          cd /tmp
          
          # Clone main QGIS plugin and GEE scripts repository
          git clone https://github.com/ConservationInternational/trends.earth.git
          
          # Clone API backend repository
          git clone https://github.com/ConservationInternational/trends.earth-api.git
          
          # Clone alternative API UI repository
          git clone https://github.com/ConservationInternational/trends.earth-api-ui.git
          
          echo "Trends.Earth ecosystem repositories cloned to /tmp for reference"

      - name: Verify setup
        run: |
          cd app/
          python test_simple.py
          echo "✓ Development environment setup complete"
          echo "✓ All runtime dependencies installed"
          echo "✓ te_schemas and te_algorithms available"
          echo "✓ Ecosystem repositories available in /tmp/"
          echo "✓ Testing tools (ruff) installed"